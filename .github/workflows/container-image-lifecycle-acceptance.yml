name: Container Image Lifecycle Acceptance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref containing the acceptance script
        required: true
        default: main
      image_tag:
        description: Existing immutable image tag without an architecture suffix
        required: true
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  native-lifecycle:
    name: lifecycle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable architecture image
        shell: bash
        run: docker pull --platform "${{ matrix.platform }}" "${{ inputs.image_tag }}-${{ matrix.arch }}"

      - name: Verify populated persistence and startup acceptance
        shell: bash
        run: bash SYSTEM/container-agent-lifecycle-smoke.sh "${{ inputs.image_tag }}-${{ matrix.arch }}" "${{ matrix.platform }}"
