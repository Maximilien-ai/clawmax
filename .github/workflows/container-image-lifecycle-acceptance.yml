name: Container Image Lifecycle Acceptance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref containing the acceptance script
        required: true
        default: main
      image_tag:
        description: Existing immutable image tag without an architecture suffix
        required: true
      source_entrypoint:
        description: Diagnostic only - mount source entrypoint; does not approve the packaged image
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      source_entrypoint:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  native-lifecycle:
    name: lifecycle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable architecture image
        shell: bash
        run: docker pull --platform "${{ matrix.platform }}" "${{ inputs.image_tag }}-${{ matrix.arch }}"

      - name: Recover a known message with the packaged offline backup helper
        shell: bash
        env:
          IMAGE: ${{ inputs.image_tag }}-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --network none --platform "$PLATFORM" \
            --mount "type=bind,source=$PWD/SYSTEM/dashboard/offline-backup.test.mjs,target=/app/SYSTEM/dashboard/offline-backup.test.mjs,readonly" \
            --entrypoint sh "$IMAGE" -ec '
              export CLAWMAX_TEST_NATIVE_OPENCLAW="$(command -v openclaw)"
              test -n "$CLAWMAX_TEST_NATIVE_OPENCLAW"
              node --test --test-name-pattern="pinned OpenClaw" /app/SYSTEM/dashboard/offline-backup.test.mjs
            '

      - name: Verify populated persistence and startup acceptance
        shell: bash
        env:
          CLAWMAX_LIFECYCLE_SOURCE_ENTRYPOINT: ${{ inputs.source_entrypoint }}
        run: bash SYSTEM/container-agent-lifecycle-smoke.sh "${{ inputs.image_tag }}-${{ matrix.arch }}" "${{ matrix.platform }}"
