name: Release Container Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build for an official release image, usually a release tag like v1.7.8
        required: true
        default: v1.7.8
      release_version:
        description: Official release tag to publish, usually matching the checked-out ref
        required: true
        default: v1.7.8
      publish_latest:
        description: Also publish the latest tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/maximilien-ai/clawmax-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_tag: amd64
          - platform: linux/arm64
            arch_tag: arm64
    outputs:
      version: ${{ steps.vars.outputs.version }}
      semver: ${{ steps.vars.outputs.semver }}
      publish_latest: ${{ steps.vars.outputs.publish_latest }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve build ref and tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          ref_input="${{ inputs.source_ref }}"
          version="${{ inputs.release_version }}"
          version="${version#refs/tags/}"
          version="${version#refs/heads/}"
          semver="${version#v}"

          {
            echo "ref=${ref_input}"
            echo "version=${version}"
            echo "semver=${semver}"
            echo "publish_latest=${{ inputs.publish_latest }}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}

      - name: Record resolved source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          tags="$(printf '%s\n%s\n%s' \
            "${IMAGE_NAME}:${{ steps.vars.outputs.version }}-${{ matrix.arch_tag }}" \
            "${IMAGE_NAME}:${{ steps.vars.outputs.semver }}-${{ matrix.arch_tag }}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA::12}-${{ matrix.arch_tag }}")"

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            CLAWMAX_VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ClawMax Dashboard
            org.opencontainers.image.description=ClawMax dashboard runtime with bundled OpenClaw
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Verify packaged dashboard version in image
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_NAME}:${{ steps.vars.outputs.version }}-${{ matrix.arch_tag }}"
          expected="${{ steps.vars.outputs.semver }}"
          expected_env="${{ steps.vars.outputs.version }}"

          actual_version="$(docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh \
            "${image}" \
            -lc "node -p \"require('/app/SYSTEM/dashboard/package.json').version\"")"

          actual_env="$(docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh \
            "${image}" \
            -lc "printf '%s' \"\$CLAWMAX_VERSION\"")"

          if [ "${actual_version}" != "${expected}" ]; then
            echo "Packaged dashboard version mismatch: expected ${expected}, got ${actual_version}" >&2
            exit 1
          fi

          if [ "${actual_env}" != "${expected_env}" ]; then
            echo "CLAWMAX_VERSION mismatch: expected ${expected_env}, got ${actual_env}" >&2
            exit 1
          fi

  publish-manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve manifest tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          tags="$(printf '%s\n%s\n%s' \
            "${IMAGE_NAME}:${{ needs.build.outputs.version }}" \
            "${IMAGE_NAME}:${{ needs.build.outputs.semver }}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA::12}")"

          if [ "${{ needs.build.outputs.publish_latest }}" = "true" ]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list tags
        shell: bash
        run: |
          set -euo pipefail

          semver="${{ needs.build.outputs.semver }}"
          version="${{ needs.build.outputs.version }}"
          sha_tag="sha-${GITHUB_SHA::12}"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            suffix="${tag##*:}"
            case "$suffix" in
              "$version")
                source_a="${IMAGE_NAME}:${version}-amd64"
                source_b="${IMAGE_NAME}:${version}-arm64"
                ;;
              "$semver")
                source_a="${IMAGE_NAME}:${semver}-amd64"
                source_b="${IMAGE_NAME}:${semver}-arm64"
                ;;
              "$sha_tag")
                source_a="${IMAGE_NAME}:${sha_tag}-amd64"
                source_b="${IMAGE_NAME}:${sha_tag}-arm64"
                ;;
              latest)
                source_a="${IMAGE_NAME}:${semver}-amd64"
                source_b="${IMAGE_NAME}:${semver}-arm64"
                ;;
              *)
                echo "Unknown manifest target: $tag" >&2
                exit 1
                ;;
            esac
            docker buildx imagetools create -t "$tag" "$source_a" "$source_b"
          done <<< "${{ steps.tags.outputs.tags }}"

  registry-smoke:
    runs-on: ubuntu-latest
    needs: [build, publish-manifest]
    steps:
      - name: Checkout image publishing tools
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke published tags from registry
        shell: bash
        run: |
          set -euo pipefail

          semver="${{ needs.build.outputs.semver }}"
          version="${{ needs.build.outputs.version }}"
          image="${IMAGE_NAME}"

          retry() {
            attempts="$1"
            shift
            delay="$1"
            shift

            i=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$i" -ge "$attempts" ]; then
                return 1
              fi
              echo "Retry $i/$attempts failed for: $*"
              i=$((i + 1))
              sleep "$delay"
            done
          }

          verify_image() {
            ref="$1"
            platform="$2"
            expected_version="$3"
            expected_env="$4"

            docker image rm -f "$ref" >/dev/null 2>&1 || true
            retry 6 10 docker pull --platform "$platform" "$ref"

            actual_version="$(retry 3 5 docker run --rm --platform "$platform" --entrypoint /bin/sh "$ref" -lc "node -p \"require('/app/SYSTEM/dashboard/package.json').version\"")"
            actual_env="$(retry 3 5 docker run --rm --platform "$platform" --entrypoint /bin/sh "$ref" -lc "printf '%s' \"\$CLAWMAX_VERSION\"")"

            if [ "$actual_version" != "$expected_version" ]; then
              echo "Packaged dashboard version mismatch for $ref: expected $expected_version, got $actual_version" >&2
              return 1
            fi

            if [ "$actual_env" != "$expected_env" ]; then
              echo "CLAWMAX_VERSION mismatch for $ref: expected $expected_env, got $actual_env" >&2
              return 1
            fi
          }

          verify_image "${image}:${semver}" "linux/arm64" "${semver}" "${version}"
          verify_image "${image}:${semver}-arm64" "linux/arm64" "${semver}" "${version}"
          verify_image "${image}:${semver}-amd64" "linux/amd64" "${semver}" "${version}"

      - name: Install OCI inspection tool
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo

      - name: Record released image index for GCP mirror
        env:
          IMAGE_TAG: ${{ needs.build.outputs.semver }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          TARGET_FILE: ${{ runner.temp }}/gcp-mirror-target.json
        run: node SYSTEM/mirror-gcp-target.mjs record

      - name: Upload mirror target
        uses: actions/upload-artifact@v4
        with:
          name: gcp-mirror-target
          path: ${{ runner.temp }}/gcp-mirror-target.json
          if-no-files-found: error
          retention-days: 7
