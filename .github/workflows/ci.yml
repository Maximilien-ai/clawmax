name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release-2.0.0]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENCLAW_WORKSPACE: ${{ github.workspace }}/WORKSPACES/default
      AUTH_MODE: bypass
      DASHBOARD_AUTH_DISABLED: "true"
      DASHBOARD_PORT: "3001"
      CORS_ORIGIN: http://localhost:5173
      CLAWMAX_OPENCLAW_TARGET: v2026.9.7

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: SYSTEM/dashboard/package-lock.json

      - name: Validate test selection
        run: node --test .github/scripts/dashboard-test-scope.test.cjs

      - name: Select dashboard validation scope
        id: scope
        run: node .github/scripts/dashboard-test-scope.cjs

      - name: Validate automation and image contracts
        if: steps.scope.outputs.dashboard == 'false'
        run: |
          node --test SYSTEM/mirror-gcp-image.test.mjs SYSTEM/mirror-gcp-target.test.mjs
          sh SYSTEM/promote-tested-image.test.sh
          sh SYSTEM/dockerfile-openclaw-builder.test.sh
          sh SYSTEM/container-agent-lifecycle-smoke.test.sh

      - name: Install OpenClaw CLI
        if: steps.scope.outputs.dashboard != 'false'
        run: |
          chmod +x ./SYSTEM/prepare-openclaw-target.sh
          openclaw_bin="$(./SYSTEM/prepare-openclaw-target.sh --print-bin)"
          openclaw_skills_dir="$(./SYSTEM/prepare-openclaw-target.sh --print-skills-dir)"
          echo "OPENCLAW_BIN=${openclaw_bin}" >> "$GITHUB_ENV"
          echo "OPENCLAW_SKILLS_DIR=${openclaw_skills_dir}" >> "$GITHUB_ENV"
          echo "$(dirname "$openclaw_bin")" >> "$GITHUB_PATH"
          "$openclaw_bin" --version

      - name: Install Claude Code and Factory Droid CLIs
        if: steps.scope.outputs.dashboard != 'false'
        run: |
          chmod +x ./SYSTEM/install-runtime-clis.sh
          ./SYSTEM/install-runtime-clis.sh

      - name: Install jq
        if: steps.scope.outputs.dashboard != 'false'
        run: sudo apt-get install -y jq

      - name: Run setup
        if: steps.scope.outputs.dashboard != 'false'
        run: ./setup.sh < /dev/null

      - name: Reject high and critical dependency advisories
        working-directory: SYSTEM/dashboard
        run: npm run security:audit

      - name: Lint and validate developer commands
        if: steps.scope.outputs.dashboard != 'false'
        run: ./lint.sh

      - name: Build dashboard
        if: steps.scope.outputs.dashboard != 'false'
        run: ./build.sh

      - name: Prepare dashboard env
        if: steps.scope.outputs.dashboard != 'false'
        run: |
          cat > SYSTEM/dashboard/.env <<EOF
          OPENCLAW_WORKSPACE=${OPENCLAW_WORKSPACE}
          OPENCLAW_SKILLS_DIR=${OPENCLAW_SKILLS_DIR}
          DASHBOARD_AUTH_DISABLED=${DASHBOARD_AUTH_DISABLED}
          DASHBOARD_PORT=${DASHBOARD_PORT}
          CORS_ORIGIN=${CORS_ORIGIN}
          NODE_ENV=test
          EOF

      - name: Start dashboard server
        if: steps.scope.outputs.dashboard != 'false'
        run: |
          cd SYSTEM/dashboard
          npx ts-node server/index.ts > /tmp/clawmax-ci-dashboard.log 2>&1 &
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3001/api/health > /dev/null 2>&1 || {
            echo "::error::Dashboard server failed to start"
            cat /tmp/clawmax-ci-dashboard.log
            exit 1
          }

      - name: Run tests
        if: steps.scope.outputs.dashboard != 'false'
        run: ./test.sh --coverage
