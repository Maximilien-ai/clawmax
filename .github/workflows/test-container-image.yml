name: Test Container Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build for validation, usually a branch or tag ref such as main or refs/tags/v1.9.2
        required: true
        default: main
      test_tag:
        description: Test image suffix, for example rc1 or qa-max
        required: true
        default: rc1

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/maximilien-ai/clawmax-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_tag: amd64
          - platform: linux/arm64
            arch_tag: arm64
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      test_tag: ${{ steps.vars.outputs.test_tag }}
    steps:
      - name: Resolve build ref
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          source_ref='${{ inputs.source_ref }}'
          test_tag="$(printf '%s' '${{ inputs.test_tag }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          if [ -z "$test_tag" ]; then
            echo "test_tag cannot be empty after normalization" >&2
            exit 1
          fi

          ref="${source_ref}"
          if printf '%s' "${source_ref}" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "source_ref must be an advertised branch or tag ref, not a raw commit SHA: ${source_ref}" >&2
            echo "Use 'main' or an explicit tag ref such as refs/tags/v1.9.2 instead." >&2
            exit 1
          fi

          {
            echo "ref=${ref}"
            echo "source_ref=${source_ref}"
            echo "test_tag=${test_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}

      - name: Record resolved source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve packaged release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          semver="$(node -p "require('./SYSTEM/dashboard/package.json').version")"
          version="v${semver}"
          {
            echo "version=${version}"
            echo "semver=${semver}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          tags="$(printf '%s' \
            "${IMAGE_NAME}:${{ steps.version.outputs.semver }}-test-${{ steps.vars.outputs.test_tag }}-${{ matrix.arch_tag }}")"

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            CLAWMAX_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ClawMax Dashboard
            org.opencontainers.image.description=ClawMax dashboard runtime with bundled OpenClaw
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Verify packaged dashboard version in image
        shell: bash
        run: |
          set -euo pipefail

          image="${IMAGE_NAME}:${{ steps.version.outputs.semver }}-test-${{ steps.vars.outputs.test_tag }}-${{ matrix.arch_tag }}"
          expected="${{ steps.version.outputs.semver }}"
          expected_env="${{ steps.version.outputs.version }}"

          actual_version="$(docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh \
            "${image}" \
            -lc "node -p \"require('/app/SYSTEM/dashboard/package.json').version\"")"

          actual_env="$(docker run --rm \
            --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh \
            "${image}" \
            -lc "printf '%s' \"\$CLAWMAX_VERSION\"")"

          if [ "${actual_version}" != "${expected}" ]; then
            echo "Packaged dashboard version mismatch: expected ${expected}, got ${actual_version}" >&2
            exit 1
          fi

          if [ "${actual_env}" != "${expected_env}" ]; then
            echo "CLAWMAX_VERSION mismatch: expected ${expected_env}, got ${actual_env}" >&2
            exit 1
          fi

  publish-manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve manifest tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          tags="$(printf '%s' \
            "${IMAGE_NAME}:${{ needs.build.outputs.semver }}-test-${{ needs.build.outputs.test_tag }}")"

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list tags
        shell: bash
        run: |
          set -euo pipefail

          test_tag="${{ needs.build.outputs.test_tag }}"
          semver="${{ needs.build.outputs.semver }}"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            suffix="${tag##*:}"
            case "$suffix" in
              "${semver}-test-${test_tag}")
                source_a="${IMAGE_NAME}:${semver}-test-${test_tag}-amd64"
                source_b="${IMAGE_NAME}:${semver}-test-${test_tag}-arm64"
                ;;
              *)
                echo "Unknown manifest target: $tag" >&2
                exit 1
                ;;
            esac
            docker buildx imagetools create -t "$tag" "$source_a" "$source_b"
          done <<< "${{ steps.tags.outputs.tags }}"

  registry-smoke:
    runs-on: ubuntu-latest
    needs: [build, publish-manifest]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke published tags from registry
        shell: bash
        run: |
          set -euo pipefail

          test_tag="${{ needs.build.outputs.test_tag }}"
          semver="${{ needs.build.outputs.semver }}"
          version="${{ needs.build.outputs.version }}"
          image="${IMAGE_NAME}"

          retry() {
            attempts="$1"
            shift
            delay="$1"
            shift

            i=1
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$i" -ge "$attempts" ]; then
                return 1
              fi
              echo "Retry $i/$attempts failed for: $*"
              i=$((i + 1))
              sleep "$delay"
            done
          }

          verify_image() {
            ref="$1"
            platform="$2"
            expected_version="$3"
            expected_env="$4"

            docker image rm -f "$ref" >/dev/null 2>&1 || true
            retry 6 10 docker pull --platform "$platform" "$ref"

            actual_version="$(retry 3 5 docker run --rm --platform "$platform" --entrypoint /bin/sh "$ref" -lc "node -p \"require('/app/SYSTEM/dashboard/package.json').version\"")"
            actual_env="$(retry 3 5 docker run --rm --platform "$platform" --entrypoint /bin/sh "$ref" -lc "printf '%s' \"\$CLAWMAX_VERSION\"")"

            if [ "$actual_version" != "$expected_version" ]; then
              echo "Packaged dashboard version mismatch for $ref: expected $expected_version, got $actual_version" >&2
              return 1
            fi

            if [ "$actual_env" != "$expected_env" ]; then
              echo "CLAWMAX_VERSION mismatch for $ref: expected $expected_env, got $actual_env" >&2
              return 1
            fi
          }

          verify_image "${image}:${semver}-test-${test_tag}" "linux/arm64" "${semver}" "${version}"
          verify_image "${image}:${semver}-test-${test_tag}-arm64" "linux/arm64" "${semver}" "${version}"
          verify_image "${image}:${semver}-test-${test_tag}-amd64" "linux/amd64" "${semver}" "${version}"
